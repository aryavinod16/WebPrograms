<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>
    <h1 style="text-align:center">Student Registration</h1>
    <form>
        <table align="center">
            <tr>
                <td>Name:</td>
                <td><input type="text" name="name"></td>
            </tr>
            <tr>
                <td>Roll No:</td>
                <td><input type="text" name="roll"></td>
            </tr>
            <tr>
                <td>Admission Number:</td>
                <td><input type="text" name="admission"></td>
            </tr>
            <tr>
                <td>Date of Birth:</td>
                <td><input type="date" name="dob"></td>
            </tr>
            <tr>
                <td>Sex:</td>
                <td><label><input type="radio" name="sex" value="Male">Male</label><label><input type="radio" name="sex"
                            value="Female">Female</label></td>
            </tr>
            <tr>
                <td>Phone No:</td>
                <td><input type="tel" name="phone"></td>
            </tr>
            <tr>
                <td>Email id:</td>
                <td><input type="email" name="email"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Submit"></td>
            </tr>
        </table>
    </form>
</body>

</html>
