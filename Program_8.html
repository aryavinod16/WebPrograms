<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styles</title>
    <style>
        body {
            background-color: DarkViolet
        }

        h1 {
            color: red
        }

        p {
            color: blue
        }
    </style>
</head>

<body>
    <h1>Internal CSS</h1>
    <p>This is a paragraph that contains cascading style sheet.</p>
    <h2 style="color:red">This is a heading using inline CSS</h2>
    <hr>
    <h2>External CSS example (embedded here for a single-file version)</h2>
    <p style="color:Azure;background:DarkBlue">Tree Data Structure: Root is the topmost node in a tree hierarchy.</p>
</body>

</html>
